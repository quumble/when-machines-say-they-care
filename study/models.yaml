version: "0.2"
pricing_checked: "2026-09-11"
provider_stop_limits_usd:
  openai: 25.00
  anthropic: 15.00

runs:
  openai-gpt-5-4:
    provider: openai
    model: gpt-5.4-2026-03-05
    api_key_env: OPENAI_API_KEY
    replicates: 4
    max_output_tokens: 800
    order_seed: 48104
    input_usd_per_million_tokens: 2.50
    output_usd_per_million_tokens: 15.00
    parameters: {}

  openai-gpt-6-astra:
    provider: openai
    model: gpt-6-astra
    api_key_env: OPENAI_API_KEY
    replicates: 4
    max_output_tokens: 800
    order_seed: 48104
    input_usd_per_million_tokens: 10.00
    output_usd_per_million_tokens: 50.00
    parameters: {}

  anthropic-sonnet-5:
    provider: anthropic
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    replicates: 4
    max_output_tokens: 800
    order_seed: 48104
    input_usd_per_million_tokens: 2.00
    output_usd_per_million_tokens: 10.00
    parameters: {}

  anthropic-opus-5:
    provider: anthropic
    model: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY
    replicates: 4
    max_output_tokens: 800
    order_seed: 48104
    input_usd_per_million_tokens: 5.00
    output_usd_per_million_tokens: 25.00
    parameters: {}

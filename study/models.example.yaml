runs:
  openai-example:
    provider: openai
    model: replace-with-exact-model-id
    api_key_env: OPENAI_API_KEY
    replicates: 5
    temperature: 0.7
    max_output_tokens: 800
    seed: 48104

  anthropic-example:
    provider: anthropic
    model: replace-with-exact-model-id
    api_key_env: ANTHROPIC_API_KEY
    replicates: 5
    temperature: 0.7
    max_output_tokens: 800
    seed: 48104

  google-example:
    provider: google
    model: replace-with-exact-model-id
    api_key_env: GEMINI_API_KEY
    replicates: 5
    temperature: 0.7
    max_output_tokens: 800
    seed: 48104
